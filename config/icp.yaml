# Критерии идеального клиента (ICP) и настройки Checko.
# Правится без правки кода.

provider:
  base_url: "https://api.checko.ru/v2"
  timeout_seconds: 30
  retries: 3
  pause_seconds: 0.5

  # СУТОЧНЫЙ БЮДЖЕТ ЗАПРОСОВ. На бесплатном тарифе Checko — 100 в сутки.
  # Сборка списка возобновляемая: упёрлись в лимит — завтра продолжим с того
  # же места, ничего не потеряется.
  daily_request_budget: 100

  # Сколько компаний проверять за прогон. Каждая стоит 1–2 запроса:
  # карточка всегда, финансы — только если карточка прошла по профилю.
  # 40 компаний ≈ 60–80 запросов, что укладывается в суточный бюджет.
  enrich_per_run: 40

  # Сколько страниц поиска запрашивать за прогон (1 страница ≈ 100 компаний).
  discover_per_run: 5

  # Целевой размер буфера непроверенных кандидатов. Пока буфер полон,
  # поиск не тратит запросы вообще.
  #
  # Зачем буфер. Кандидатов десятки тысяч (только ОКВЭД 62.01 по Москве —
  # около 14 000), перебрать всех нереально и не нужно. При потребности
  # в 20 письмах в день хватает проверять ~40 компаний в сутки.
  candidate_buffer: 500

target_list:
  # ОКВЭД, по которым ищем кандидатов. Это ядро вашего ICP —
  # разработка ПО и IT-услуги на заказ.
  okved:
    - "62.01"    # Разработка компьютерного программного обеспечения
    - "62.02"    # Консультативная деятельность в области компьютерных технологий
    - "62.09"    # Прочая деятельность, связанная с ИТ
    - "63.11"    # Обработка данных, размещение информации

  # Коды регионов РФ (двузначные — это НЕ коды ОКАТО из signals.yaml).
  regions:
    - code: "77"
      name: "Москва"
    - code: "78"
      name: "Санкт-Петербург"
    - code: "50"
      name: "Московская область"
    - code: "66"
      name: "Свердловская область"
    - code: "54"
      name: "Новосибирская область"
    - code: "16"
      name: "Республика Татарстан"

  # Организационно-правовая форма: 12300 = ООО.
  # ИП и АО на старте не берём: у ИП обычно нет отдела продаж,
  # у АО другой масштаб и цикл согласований.
  opf: "12300"

  # Только действующие юрлица.
  only_active: true

criteria:
  # Штат. Меньше — не потянут чек, больше — долго согласовывают.
  staff_min: 15
  staff_max: 100

  # Выручка в рублях. Нижняя граница отсекает пустышки,
  # верхняя — компании не вашего размера.
  revenue_min: 20000000        # 20 млн
  revenue_max: 1500000000      # 1.5 млрд

  # Минимальный возраст в годах: у компании младше года ещё нет
  # ни отчётности, ни устоявшегося процесса продаж.
  min_age_years: 2

  # ОКВЭД, при которых компанию отбрасываем, даже если основной подошёл.
  # 78.10 — кадровые агентства: они ищут не себе.
  exclude_okved:
    - "78.10"
    - "78.30"

signal_scoring:
  # Пока событийный источник сигнала не найден, приоритет в утреннем
  # списке задаётся динамикой выручки. Логика: компания живая (штат есть),
  # но деньги не растут — это и есть боль в привлечении клиентов.
  #
  # Порог падения год к году, при котором сигнал считаем сильным.
  strong_decline_pct: -10.0

  # Диапазон, который считаем стагнацией (тоже повод написать).
  flat_from_pct: -10.0
  flat_to_pct: 5.0
