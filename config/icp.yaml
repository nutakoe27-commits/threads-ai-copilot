# Критерии идеального клиента (ICP) и настройки Checko.
# Правится без правки кода.

provider:
  base_url: "https://api.checko.ru/v2"
  timeout_seconds: 30
  retries: 3
  pause_seconds: 0.5

  # СУТОЧНЫЙ БЮДЖЕТ ЗАПРОСОВ. На бесплатном тарифе Checko — 100 в сутки.
  # Сборка списка возобновляемая: упёрлись в лимит — завтра продолжим с того
  # же места, ничего не потеряется.
  daily_request_budget: 100

  # Сколько компаний проверять за прогон. Каждая стоит 1–2 запроса:
  # карточка всегда, финансы — только если карточка прошла по профилю.
  #
  # Замер на первом боевом прогоне: 40 компаний = 53 запроса (13 прошли
  # ступень профиля и получили запрос финансов). То есть коэффициент ~1.33.
  # 70 компаний ≈ 93 запроса — помещается в бесплатные 100 вместе с поиском.
  enrich_per_run: 70

  # Сколько страниц поиска запрашивать за прогон (1 страница ≈ 100 компаний).
  discover_per_run: 5

  # Целевой размер буфера непроверенных кандидатов. Пока буфер полон,
  # поиск не тратит запросы вообще.
  #
  # Зачем буфер. Кандидатов десятки тысяч (только ОКВЭД 62.01 по Москве —
  # около 14 000), перебрать всех нереально и не нужно. При потребности
  # в 20 письмах в день хватает проверять ~40 компаний в сутки.
  candidate_buffer: 500

target_list:
  # ОКВЭД, по которым ищем кандидатов. Это ядро вашего ICP —
  # разработка ПО и IT-услуги на заказ.
  okved:
    - "62.01"    # Разработка компьютерного программного обеспечения
    - "62.02"    # Консультативная деятельность в области компьютерных технологий
    - "62.09"    # Прочая деятельность, связанная с ИТ
    - "63.11"    # Обработка данных, размещение информации

  # Коды регионов РФ (двузначные — это НЕ коды ОКАТО из signals.yaml).
  regions:
    - code: "77"
      name: "Москва"
    - code: "78"
      name: "Санкт-Петербург"
    - code: "50"
      name: "Московская область"
    - code: "66"
      name: "Свердловская область"
    - code: "54"
      name: "Новосибирская область"
    - code: "16"
      name: "Республика Татарстан"

  # Организационно-правовая форма: 12300 = ООО.
  # ИП и АО на старте не берём: у ИП обычно нет отдела продаж,
  # у АО другой масштаб и цикл согласований.
  opf: "12300"

  # Только действующие юрлица.
  only_active: true

  # С какой доли списка страниц начинать поиск (0.0 — с самого начала).
  #
  # Зачем. Checko сортирует выдачу по ОГРН, а в ОГРН зашит год регистрации.
  # Поэтому первые страницы — это компании 90-х и начала 2000-х, среди
  # которых много спящих пустышек (в первом же зонде попалась «АНАНТА»:
  # 1999 год, штат 0, выручка 166 тыс.). Живые IT-компании нашего размера
  # регистрировались позже и лежат ближе к концу списка.
  #
  # 0.5 = начать с середины. Поднимите до 0.7, если и там много старья;
  # опустите, если наоборот попадаются слишком молодые.
  start_page_fraction: 0.5

criteria:
  # Штат. Меньше — не потянут чек, больше — долго согласовывают.
  staff_min: 15
  staff_max: 100

  # Выручка в рублях. Нижняя граница отсекает пустышки,
  # верхняя — компании не вашего размера.
  revenue_min: 20000000        # 20 млн
  revenue_max: 1500000000      # 1.5 млрд

  # Минимальный возраст в годах: у компании младше года ещё нет
  # ни отчётности, ни устоявшегося процесса продаж.
  min_age_years: 2

  # ВЫРУЧКА НА СОТРУДНИКА, рублей в год.
  #
  # Ориентиры по рынку:
  #   0.8–1.5 млн — очень дёшево: либо раздутый штат, либо провал
  #   1.5–4.0 млн — типичный аутсорс и аутстафф
  #   4.0–8.0 млн — продуктовая компания или сильная экспертиза
  #   8.0+ млн    — почти наверняка перепродажа железа и лицензий
  #
  # ВЕРХНЯЯ граница работает в лоб: выше — перепродажа, не наш клиент.
  # По ней в первом прогоне отсеялась «ЭЛЕТЕК» (865 млн при штате до 100).
  #
  # НИЖНЯЯ граница НЕ применяется в лоб — она сравнивается с прошлым годом:
  #   ниже порога и год назад было ниже  → раздутая компания, отсеиваем
  #   ниже порога, а год назад было выше → упали за год, это лучший адресат
  #
  # Логика: у компании, которая просела за год, была нормальная экономика,
  # есть память о том, как должно быть, и есть острая признанная боль.
  # Именно такой случай — «СМАРТКОНТРАКТ»: 59 человек, падение выручки
  # на 63%. Плоский порог выбрасывал его вместе с мусором.
  revenue_per_employee_min: 800000
  revenue_per_employee_max: 8000000

  # ОКВЭД, при которых компанию отбрасываем, даже если основной подошёл.
  # 78.10 — кадровые агентства: они ищут не себе.
  exclude_okved:
    - "78.10"
    - "78.30"

signal_scoring:
  # Пока событийный источник сигнала не найден, приоритет в утреннем
  # списке задаётся динамикой выручки. Логика: компания живая (штат есть),
  # но деньги не растут — это и есть боль в привлечении клиентов.
  #
  # Порог падения год к году, при котором сигнал считаем сильным.
  strong_decline_pct: -10.0

  # Диапазон, который считаем стагнацией (тоже повод написать).
  flat_from_pct: -10.0
  flat_to_pct: 5.0

website:
  # Обход сайта компании для классификации (Этап 3).
  # Реестр не отличает разработку на заказ от продуктовой компании — сайт отличает.

  # Сколько компаний обрабатывать за прогон.
  per_run: 25

  # Не более этого числа страниц с одного сайта.
  max_pages: 4

  # Пауза между запросами к одному сайту, секунд. Если robots.txt требует
  # больше через Crawl-delay — используется его значение.
  pause_seconds: 2.0

  timeout_seconds: 15

  # Контакт в User-Agent: чтобы владелец сайта мог понять, кто к нему ходит,
  # и при желании связаться. Заполните своей почтой или адресом сайта.
  contact: "m@krichigin.ru"

  # Сколько страниц вакансий смотреть дополнительно к описанию компании.
  # Вакансия в продажи — единственный событийный сигнал в системе, поэтому
  # эти страницы читаются даже если описание уже собралось.
  career_pages: 2

  # Perplexity Sonar: поиск страниц про компанию, которых нет на главной.
  # Ключ — в переменной окружения PERPLEXITY_API_KEY, в конфиге его нет.
  # Роль — указатель, где искать, а не источник фактов (DECISIONS.md, Р-028).
  perplexity:
    model: "sonar"
    # low | medium | high. Глубина прямо влияет на цену запроса
    # ($5 против $14 за тысячу), а нам нужны ссылки, а не рассуждения.
    search_context_size: "low"
    timeout_seconds: 45

  # КОМУ ПИШЕМ. Тип компании определяется по её сайту и дальше задаёт
  # угол письма, а не пропуск на входе: аутсорсу и продуктовой компании
  # нужны разные слова, но лидген болит у обоих.
  #
  # Убирайте отсюда типы, которым писать не хотите.
  #   outsourcing — разработка на заказ
  #   staffing    — аутстафф команд
  #   integrator  — системный интегратор
  #   product     — своя продуктовая компания
  #   not_it      — не про IT (сюда попадают чужие с айтишным ОКВЭД)
  #   unknown     — по сайту понять не удалось
  target_types:
    - outsourcing
    - staffing
    - integrator
    - product

compose:
  # Сколько писем писать за один прогон.
  per_run: 20

  # СКОЛЬКО ФАКТОВ ИЗ ДОСЬЕ ДОЛЖНО БЫТЬ В ПИСЬМЕ, чтобы его вообще выпустить.
  #
  # Письмо прямым текстом говорит: «компанию нашла система, факт нашла она».
  # Если факт при этом общий («занимаются разработкой»), письмо опровергает
  # само себя — читатель видит не слабый текст, а слабую систему.
  #
  # Письма, набравшие меньше, не попадают в утренний список: они уходят
  # в хвост отчёта отдельным блоком «отложено». Посмотреть их:
  #   sqlite3 data/leads.db < tools/thin.sql
  #
  # Ставьте 0, если хотите видеть все письма и решать самому.
  min_facts: 2

  # МИНИМАЛЬНЫЙ РЕЙТИНГ КОМПАНИИ, при котором вообще пишем письмо.
  #
  # Рейтинг — это балл схождения сигналов из раздела scoring ниже. Он виден
  # в панели рядом с каждой компанией. Считается бесплатно, по тому, что уже
  # в базе.
  #
  # Зачем порог. Письмо стоит запроса к самой дорогой модели. Компания,
  # у которой не сошлось ни одного признака (нет вакансии в продажи, нет
  # следов платного трафика, выручка ровная), — это письмо в никуда
  # за ваши деньги (DECISIONS.md, Р-054).
  #
  # Ориентиры по весам ниже:
  #   0–2   ничего не сошлось: только тип компании или только аналитика
  #   3–5   один заметный признак
  #   5–8   два-три признака вместе — с этого начинается смысл
  #   8+    сошлось много, писать в первую очередь
  #
  # Сколько компаний отсеялось по этому порогу, видно в логе прогона.
  # Ставьте 0, чтобы писать всем, кто прошёл ICP.
  min_score: 5.0

scoring:
  # БАЛЛ СХОЖДЕНИЯ СИГНАЛОВ. По нему сортируется утренний список.
  #
  # Почему балл, а не сортировка по одному признаку. Обзоры сходятся:
  # один сигнал почти ничего не значит, значение имеет схождение нескольких
  # на одной компании. Компания с тремя слабыми признаками интереснее
  # компании с одним сильным (DECISIONS.md, Р-046).
  #
  # Балл НЕ решает, писать компании или нет. Он решает только порядок.
  # Отсев делают критерии ICP и порог фактов — там решения бинарные.
  #
  # Порядок величин важнее точных чисел: событие весит больше состояния,
  # состояние больше догадки.
  weights:
    # События — происходят сегодня, завтра могут не повториться.
    hiring_strong: 5.0        # ищут людей прямо на холодные звонки
    hiring_normal: 3.0        # ищут в продажи вообще
    registry_software: 4.0    # попали в реестр отечественного ПО

    # Состояния — верны и вчера, и через полгода.
    pays_for_traffic: 3.0     # стоит коллтрекинг или Roistat
    captures_leads: 1.5       # виджеты захвата входящих
    has_analytics: 1.0        # хотя бы считают трафик
    product_company: 2.0      # круг покупателей уже, система нагляднее
    revenue_dropped: 2.0      # выручка просела за год
    revenue_flat: 1.0         # стагнация
    accredited: 0.5           # подтверждение, что это правда IT

    # Штрафы.
    no_marketing_traces: -1.0  # ни счётчиков, ни виджетов
    wrong_desk_email: -1.0     # известен только адрес не того отдела

ui:
  # Локальная панель: письма с кнопками, воронка, логи.
  # Слушает только 127.0.0.1 — снаружи недоступна, и это намеренно:
  # здесь лежат письма, контакты компаний и ключи в логах.
  host: "127.0.0.1"
  port: 8765

followup:
  # Дожимы — второе и третье письмо тем, кто не ответил.
  # По внешним данным около 42% ответов приходят именно на них.
  enabled: true

  # Через сколько дней после отправки писать снова.
  # Меньше трёх — навязчиво, больше семи — про вас забыли.
  delay_days: 4

  # Сколько писем всего на компанию, включая первое. Третье — последнее.
  max_touches: 3

  # Сколько дожимов писать за один прогон.
  per_run: 10

report:
  # Сколько компаний максимум в одном утреннем списке.
  max_companies: 20

  # Отправлять ли список в Telegram сразу после сборки.
  # Нужны TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID в .env.
  telegram: true

  # Сколько сообщений максимум слать в Telegram за раз.
  telegram_max_blocks: 25

outreach:
  # Отправляете вы руками, из своего ящика. Система только готовит тексты
  # и считает результат по вашим отметкам (DECISIONS.md, Р-040).
  from_email: "m@krichigin.ru"

  # Сколько писем в день отправлять. Это не проверяется кодом — вы шлёте
  # сами, — но число здесь, чтобы было куда посмотреть.
  #
  # ПРОГРЕВ НОВОГО ДОМЕНА. Первые дни 3-5 писем, дальше рост не больше
  # чем на треть каждые два-три дня. Подробности в RUNBOOK.md.
  daily_limit: 20
