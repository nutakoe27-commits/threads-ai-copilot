# Сигналы: что считаем признаком боли в лидгене.
# Этот файл можно и нужно править без правки кода.

source:
  # Базовый URL открытого API «Работа России».
  base_url: "http://opendata.trudvsem.ru/api/v1"

  # Сколько дней назад смотреть вакансии. При ежедневном запуске хватает 2
  # (перекрытие на случай, если вчерашний прогон не отработал).
  lookback_days: 3

  # Записей за один запрос к API. Больше 100 сервис обычно не отдаёт.
  page_size: 100

  # Предохранитель: максимум страниц на один регион за прогон.
  # 50 страниц x 100 = 5000 вакансий на регион. Если упираемся в потолок —
  # это видно в логе, и надо сужать lookback_days или регионы.
  max_pages_per_region: 50

  timeout_seconds: 30
  retries: 3

# Регионы. Код — по классификатору ОКАТО, как его использует trudvsem.
#
# ВАЖНО: коды стоит перепроверить при первом запуске. Если по региону
# стабильно приходит 0 вакансий — почти наверняка неверный код, и это будет
# видно в логе строкой "регион ... вернул 0 вакансий".
# Ненужные регионы просто закомментируйте.
regions:
  - code: "7700000000000"
    name: "Москва"
  - code: "7800000000000"
    name: "Санкт-Петербург"
  - code: "5000000000000"
    name: "Московская область"
  - code: "6600000000000"
    name: "Свердловская область"
  - code: "5400000000000"
    name: "Новосибирская область"
  - code: "1600000000000"
    name: "Республика Татарстан"

keywords:
  # СИЛЬНЫЕ сигналы. Компания прямым текстом пишет, что ищет клиентов руками.
  # Достаточно одного совпадения, чтобы вакансия попала в список с высоким
  # приоритетом.
  strong:
    - "холодные звонки"
    - "холодный обзвон"
    - "холодная база"
    - "поиск новых клиентов"
    - "привлечение новых клиентов"
    - "формирование базы"
    - "наработка клиентской базы"
    - "активные продажи"
    - "поиск и привлечение клиентов"
    - "лидогенерац"
    - "генерация лидов"

  # ОБЫЧНЫЕ сигналы. Ищут людей в продажи — значит, решают проблему наймом.
  # Совпадение по названию должности или тексту вакансии.
  normal:
    - "менеджер по продажам"
    - "менеджер активных продаж"
    - "руководитель отдела продаж"
    - "начальник отдела продаж"
    - "директор по продажам"
    - "sales manager"
    - "sales"
    - "коммерческий директор"
    - "специалист по продажам"
    - "менеджер по работе с клиентами"
    - "менеджер по развитию"
    - "бизнес-девелопмент"
    - "sdr"
    - "лидогенератор"
    - "маркетолог"

  # СТОП-СЛОВА. Если встретились в названии должности — вакансия отбрасывается.
  # Здесь отсекаем розницу, B2C и позиции, не связанные с B2B-продажами.
  exclude_job:
    - "продавец"
    - "кассир"
    - "консультант зала"
    - "продавец-консультант"
    - "мерчандайзер"
    - "торговый представитель"
    - "агент по недвижимости"
    - "риэлтор"
    - "страховой агент"
    - "оператор call"
    - "оператор колл"
    - "курьер"
    - "водитель"
    - "кладовщик"
    - "менеджер по закупкам"
    - "менеджер по персоналу"
    - "менеджер по логистике"
    - "стажер"
    - "стажёр"
    - "практикант"

filters:
  # Кадровые агентства не наш ICP: они ищут не себе.
  skip_hr_agencies: true

  # Вакансии без ИНН работодателя пропускаем — по ним нельзя проверить ICP
  # на Этапе 2 и нельзя надёжно дедуплицировать.
  require_inn: true

  # Сколько дней не показывать компанию повторно после попадания в список.
  # Защита от «одна компания висит в списке каждое утро».
  company_cooldown_days: 30

report:
  # Максимум компаний в утреннем списке. Вы говорили про 20 в день —
  # ставим с запасом, лишнее просто не покажем.
  max_companies: 25

  # Сначала компании с сильными сигналами.
  strong_first: true
